# Render blueprint for the AI Desktop Streamlit app.
#
# To deploy: commit this file, push, then in the Render dashboard choose
# New -> Blueprint and point it at this repo. Render reads this file, creates
# the service, and prompts once for every value marked `sync: false` -- those
# are the secrets, and keeping them out of this file is what keeps them out of
# git. After that, every push to `branch` redeploys.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ai-desktop
    runtime: python
    # Free instances sleep after 15 minutes idle and cold-start in ~30-60s, and
    # they cap at 512 MB RAM. Streamlit + chromadb + langchain is a heavy import
    # graph, so if deploys start dying with "Ran out of memory", this is the
    # line to change -- `starter` is the next step up.
    plan: free
    # Closest region to IST. Others: oregon, ohio, virginia, frankfurt.
    region: singapore
    branch: master

    # pip, deliberately, rather than `uv sync`. uv.lock resolves pyproject.toml,
    # whose only two dependencies are pyaudio and speechrecognition -- and
    # PyAudio compiles against the portaudio19-dev headers, which Render's
    # native Python runtime does not ship. A uv build dies there before it
    # installs anything the web app actually needs. requirements.txt is the list
    # this app really runs on.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    # Streamlit defaults to binding 8501 on localhost, which Render's proxy
    # cannot reach; it has to take the port Render assigns and listen on all
    # interfaces. `headless` stops it trying to open a browser and prompting for
    # an email address on first run, which would hang the boot.
    startCommand: >-
      streamlit run main.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --browser.gatherUsageStats false

    # Streamlit's own health endpoint. Without this Render probes `/`, which for
    # Streamlit is a JS shell that can report healthy before the app is ready.
    healthCheckPath: /_stcore/health

    autoDeploy: true

    envVars:
      # .python-version already pins 3.12; this makes the patch release explicit
      # so a Render-side default bump can't move the runtime under you.
      - key: PYTHON_VERSION
        value: "3.12.7"

      # Otherwise Python buffers stdout and the Render log tail runs minutes behind.
      - key: PYTHONUNBUFFERED
        value: "1"

      # --- Required: the app will not boot without this ------------------
      # tools/search.py reads it as os.environ["TAVILY_API_KEY"] at import time,
      # so a missing value is a KeyError during startup, not a degraded tool.
      - key: TAVILY_API_KEY
        sync: false

      # --- Optional: features degrade individually if unset --------------
      # Powers /coding. Worth setting: it is the only chat path that works
      # without an Ollama server (see OLLAMA_BASE_URL below).
      - key: GOOGLE_API_KEY
        sync: false

      # Capitalisation is deliberate -- main.py and tools/search.py both read
      # this exact name.
      - key: Open_weather_api_key
        sync: false

      # Default chat and PDF embedding both call Ollama. There is none inside
      # the container, so unless this points at a reachable host those two
      # features fail at request time (the app still starts, and /coding and
      # /crm still work). Leave it unset to keep the localhost default for dev.
      - key: OLLAMA_BASE_URL
        sync: false

      # --- Zoho CRM -------------------------------------------------------
      # "memory" keeps connections in-process, which on Render means every
      # deploy and every idle-spindown silently disconnects Zoho. Switch to
      # "mongo" and set MONGODB_URI for connections that survive a restart.
      - key: ZOHO_STORE
        value: memory
      - key: ZOHO_DEFAULT_REGION
        value: in
      - key: MONGODB_URI
        sync: false

      # --- Auth (user_auth/jwt.py) ---------------------------------------
      # Unused by the Streamlit UI, required by the API service below. Minimum
      # 32 characters -- generate one with:
      #   python -c "import secrets; print(secrets.token_urlsafe(64))"
      - key: JWT_SECRET_KEY
        sync: false

  # ---------------------------------------------------------------------
  # The OpenAPI service: same code, HTTP interface. Docs at /docs.
  # ---------------------------------------------------------------------
  - type: web
    name: ai-desktop-api
    runtime: python
    plan: free
    region: singapore
    branch: master
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    # One worker on purpose. Both the LangGraph MemorySaver checkpointer and the
    # default in-memory user and Zoho stores live in process memory, so a second
    # worker would see none of the first one's conversations, accounts, or CRM
    # connections -- requests would appear to randomly forget who you are.
    # Raise this only after USER_STORE and ZOHO_STORE are both on Mongo.
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT --workers 1

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PYTHONUNBUFFERED
        value: "1"

      # Not optional here either -- /chat imports tools/search.py, which reads
      # this at import time. Without it that endpoint returns 503.
      - key: TAVILY_API_KEY
        sync: false

      - key: GOOGLE_API_KEY
        sync: false
      - key: Open_weather_api_key
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false

      # Required. The API refuses to mint or verify a token without it, so
      # every authenticated endpoint 500s until this is set.
      - key: JWT_SECRET_KEY
        sync: false

      # "memory" loses every account on restart, and Render restarts on every
      # deploy and after each idle spin-down. Switch to "mongo" (with
      # MONGODB_URI) before you rely on logins surviving.
      - key: USER_STORE
        value: memory

      # Leave open long enough to create your account, then set to false and
      # redeploy -- this endpoint is reachable by anyone with the URL.
      - key: AUTH_ALLOW_REGISTRATION
        value: "true"

      - key: ZOHO_STORE
        value: memory
      - key: ZOHO_DEFAULT_REGION
        value: in
      - key: MONGODB_URI
        sync: false

      # Comma-separated origins for a browser frontend, e.g.
      # https://app.example.com. Unset means the CORS middleware is not mounted
      # at all, which is what you want while only Swagger UI is calling it.
      - key: CORS_ALLOW_ORIGINS
        sync: false

# No `disks:` entry on purpose. RAG/chroma_store is scratch space: main.py wipes
# the collection on every startup by design, so nothing there is worth paying to
# persist. Add a disk only if that startup wipe ever goes away.
