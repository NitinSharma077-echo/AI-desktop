# Render blueprint for AI Desktop.
#
# One service: uvicorn serves the API, the OpenAPI docs, and the web UI from a
# single process. That is what keeps the browser same-origin, so the app needs
# no CORS configuration and the token never crosses an origin boundary.
#
# To deploy: commit this file, push, then in the Render dashboard choose
# New -> Blueprint and point it at this repo. Render prompts once for every
# value marked `sync: false` -- those are the secrets, and keeping them out of
# this file is what keeps them out of git. After that, every push to `branch`
# redeploys.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ai-desktop
    # Docker, not the native python runtime: the React UI needs a Node build
    # step, and the Dockerfile does that in a stage that never ships. See the
    # comments there.
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free instances sleep after 15 minutes idle and cold-start in ~30-60s, and
    # they cap at 512 MB RAM. chromadb + langchain is a heavy import graph, so
    # if deploys start dying with "Ran out of memory", this is the line to
    # change -- `starter` is the next step up.
    plan: free
    # Closest region to IST. Others: oregon, ohio, virginia, frankfurt.
    region: singapore
    branch: main

    # No buildCommand or startCommand: the Dockerfile owns both. It installs
    # from requirements.txt rather than uv.lock on purpose -- uv.lock resolves
    # pyproject.toml, whose only two dependencies are pyaudio and
    # speechrecognition, and PyAudio needs portaudio19-dev headers to compile.
    #
    # It also runs a single worker on purpose: the LangGraph checkpointer and
    # the in-memory user and Zoho stores all live in process memory, so a second
    # worker would see none of the first one's conversations or connections.

    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # The Python version and PYTHONUNBUFFERED are set in the Dockerfile, so
      # they are not repeated here -- two places to change one thing is how
      # they end up disagreeing.

      # Authentication is OFF so the system can be exercised without creating an
      # account first. Every request runs as a shared development user, so
      # anyone with this URL can chat, upload documents, and spend whatever
      # OpenAI charges for it. The sign-in UI and the token machinery are both
      # built and tested -- closing it is this line plus JWT_SECRET_KEY.
      - key: AUTH_REQUIRED
        value: "false"

      # --- Model provider -------------------------------------------------
      # providers.py defaults to ollama so a clone runs locally with no key and
      # no spend. Deployment opts in to OpenAI explicitly: there is no Ollama
      # inside this container, so leaving it on the default means every chat
      # and every PDF embedding fails.
      - key: LLM_PROVIDER
        value: openai

      # Required whenever LLM_PROVIDER=openai. OPEN_API is also accepted, since
      # that is the name this repo's .env already uses.
      - key: OPENAI_API_KEY
        sync: false

      # Optional overrides -- providers.py picks defaults otherwise.
      - key: OPENAI_CHAT_MODEL
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        sync: false

      # Only consulted when LLM_PROVIDER=ollama. Leave unset in the cloud.
      - key: OLLAMA_BASE_URL
        sync: false

      # --- Required: the app will not boot without this ------------------
      # tools/search.py reads it as os.environ["TAVILY_API_KEY"] at import time,
      # so a missing value is a KeyError the first time /chat is called.
      - key: TAVILY_API_KEY
        sync: false

      # Only consulted once AUTH_REQUIRED is true; set it now so turning auth on
      # is a one-line change. Minimum 32 characters:
      #   python -c "import secrets; print(secrets.token_urlsafe(64))"
      - key: JWT_SECRET_KEY
        sync: false

      # --- Optional -------------------------------------------------------
      # Routes the UI's "Coding" mode and the Zoho CRM agent to Gemini.
      - key: GOOGLE_API_KEY
        sync: false

      # Capitalisation is deliberate -- tools/search.py reads this exact name.
      - key: Open_weather_api_key
        sync: false

      # --- Accounts and sessions ------------------------------------------
      # "memory" loses every account on restart, and Render restarts on every
      # deploy and after each idle spin-down. Switch to "mongo" (with
      # MONGODB_URI) before you rely on logins surviving.
      - key: USER_STORE
        value: memory

      # Leave open long enough to create your account, then set to false and
      # redeploy -- this endpoint is reachable by anyone with the URL.
      - key: AUTH_ALLOW_REGISTRATION
        value: "true"

      - key: ZOHO_STORE
        value: memory
      - key: ZOHO_DEFAULT_REGION
        value: in
      - key: MONGODB_URI
        sync: false

      # Only for a frontend hosted somewhere other than this service. The
      # bundled UI is same-origin, so leave this unset.
      - key: CORS_ALLOW_ORIGINS
        sync: false

# No `disks:` entry. RAG/chroma_store is scratch space -- uploaded documents do
# not survive a restart, which matches the in-memory defaults above. Add a disk
# only once the stores are persistent and that inconsistency starts to matter.
